# scripts/secrets-init.sh replaces AGE_PUBLIC_KEY with the age public key.
# Only data and stringData of deploy/secrets/*.enc.yaml are encrypted.
creation_rules:
  - path_regex: deploy/secrets/.*\.enc\.yaml
    encrypted_regex: '^(data|stringData)$'
    age: age103632wm5ehdxu0atthyylpzm0hh4jw599y8tjrc8pjudtymjnfhqxckkv0
