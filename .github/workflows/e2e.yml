name: e2e

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# github.ref: refs/heads/main (push и workflow_dispatch) или refs/pull/N/merge (pull_request).
# Устаревший прогон того же PR отменяется. Прогон main не прерывается: при новом push он
# остаётся в очереди той же группы, пока текущий не закончится.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # pull_request — только k3d (путь жюри: k3s в Docker, ingress :8081).
      # push в main и workflow_dispatch — ещё и нативный k3s на Ubuntu 24.04, ingress :80.
      # include целиком из fromJSON: exclude не снимает строки, добавленные через include.
      matrix:
        include: >-
          ${{ fromJSON(
            github.event_name == 'pull_request'
            && '[{"mode":"k3d","k3d":"1","ingress_port":"8081","kubeconfig":"/home/runner/.kube/config"}]'
            || '[{"mode":"k3d","k3d":"1","ingress_port":"8081","kubeconfig":"/home/runner/.kube/config"},{"mode":"k3s","k3d":"0","ingress_port":"80","kubeconfig":"/home/runner/.kube/config"}]'
          ) }}
    env:
      K3D: ${{ matrix.k3d }}
      INGRESS_PORT: ${{ matrix.ingress_port }}
      KUBECONFIG: ${{ matrix.kubeconfig }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Public DNS already maps sensor.localtest.me to 127.0.0.1. This hosts
      # line is a safety net (and adds grafana.localtest.me) if runner DNS does not.
      - name: Map localtest.me to loopback
        run: echo "127.0.0.1 sensor.localtest.me grafana.localtest.me" | sudo tee -a /etc/hosts

      # Jury path. scripts/k3s-install.sh (invoked by make up) installs pinned
      # Helm, kubectl, and k3d with sudo. Hosted runners have passwordless sudo and Docker.
      - name: make up
        run: make up

      - name: make k8s-netpol-check
        run: make k8s-netpol-check

      - name: make k8s-canary-fail
        run: make k8s-canary-fail

      - name: make k8s-rollback-demo
        run: make k8s-rollback-demo

      - name: make k8s-rotate-demo
        run: make k8s-rotate-demo

      - name: make k8s-alert-demo
        run: make k8s-alert-demo

      - name: make k8s-canary
        env:
          ANALYSIS_WAIT_S: "75"
        run: make k8s-canary

      - name: Collect diagnostics
        if: always()
        run: |
          kubectl get pods -A
          helm list -A
          kubectl -n sensor describe pods | tail -n 100
          kubectl -n monitoring get pods

      - name: make down
        if: always()
        run: make down
