name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.8.4
      - run: ruff check services/api

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest
        working-directory: services/api
        env:
          DEMO_PASSWORD: demo-stand-pass

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web

  images:
    needs: [lint, api, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # GHCR repository names must be lowercase.
      API_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-gateway
      WEB_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-web
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build sensor-gateway
        uses: docker/build-push-action@v6
        with:
          context: services/api
          load: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build sensor-web
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          load: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Scan sensor-gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

      - name: Scan sensor-web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker push "${API_IMAGE}:${SHA}"
          docker push "${API_IMAGE}:latest"
          docker push "${WEB_IMAGE}:${SHA}"
          docker push "${WEB_IMAGE}:latest"

      - name: SBOM (SPDX) for images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
          format: spdx-json
          output-file: sbom-sensor-gateway.spdx.json
          upload-artifact: true

      - name: SBOM (SPDX) for web image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
          format: spdx-json
          output-file: sbom-sensor-web.spdx.json
          upload-artifact: true


  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        if: ${{ hashFiles('deploy/helm/sensor-gateway/**', 'deploy/helm/sensor-gateway/*') != '' }}
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and template chart
        if: ${{ hashFiles('deploy/helm/sensor-gateway/**', 'deploy/helm/sensor-gateway/*') != '' }}
        run: |
          helm lint deploy/helm/sensor-gateway
          helm template sensor deploy/helm/sensor-gateway --namespace sensor

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate chart and monitoring manifests
        run: |
          set -euo pipefail
          schema='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          args=(-strict -summary -kubernetes-version 1.31.0 -schema-location default -schema-location "$schema")
          # Capabilities.APIVersions.Has is an exact match on
          # monitoring.coreos.com/v1/ServiceMonitor. The group/version alone
          # does not render the ServiceMonitor.
          helm template sensor deploy/helm/sensor-gateway \
            --namespace sensor \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor \
            | kubeconform "${args[@]}"
          helm template sensor-canary deploy/helm/sensor-gateway \
            --namespace sensor \
            --api-versions monitoring.coreos.com/v1 \
            --api-versions monitoring.coreos.com/v1/ServiceMonitor \
            --set track=canary \
            --set canary.enabled=true \
            --set canary.weight=10 \
            | kubeconform "${args[@]}"
          # values-kube-prometheus-stack.yaml is Helm values, not a manifest.
          kubeconform "${args[@]}" \
            deploy/monitoring/dashboard-configmap.yaml \
            deploy/monitoring/prometheusrule.yaml

  dockerfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/api/Dockerfile
          failure-threshold: error

      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: error

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck scripts/*.sh
