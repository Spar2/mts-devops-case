name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
        working-directory: services/api
      - run: python -m pytest
        working-directory: services/api
        env:
          DEMO_PASSWORD: demo-stand-pass

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  images:
    needs: [api, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sensor-gateway:ci ./services/api
      - run: docker build -t sensor-web:ci ./apps/web
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sensor-gateway:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sensor-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
