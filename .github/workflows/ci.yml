name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Push в main публикует тег :latest. Прогоны одного ref идут очередью, без отмены,
# чтобы более ранний коммит не перезаписал тег после более позднего.
# Pull request: новый пуш в ту же голову отменяет незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.8.4
      - run: ruff check services/api

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pytest
        working-directory: services/api
        env:
          DEMO_PASSWORD: demo-stand-pass

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web

  # Сборка и Trivy без push. packages: write нет: на pull request публиковать нечего.
  # Push не в main сюда же попадает и тоже не публикует. Взаимоисключающе с images-publish.
  images:
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs: [lint, api, web, helm, manifests, dockerfiles, shellcheck, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # GHCR repository names must be lowercase.
      API_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-gateway
      WEB_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Image tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build sensor-gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/api
          load: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build sensor-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/web
          load: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Scan sensor-gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

      - name: Scan sensor-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

  # Только push в main. packages: write есть только здесь: право задаётся на весь job,
  # шаг с if его не отзывает. Образ с раннера job images не забрать, поэтому сборка повторяется.
  # На main job images не запускается.
  images-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, api, web, helm, manifests, dockerfiles, shellcheck, iac]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # GHCR repository names must be lowercase.
      API_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-gateway
      WEB_IMAGE: ghcr.io/spar2/mts-devops-case/sensor-web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Image tag
        id: tag
        run: echo "sha=$(git rev-parse --short=7 HEAD | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build sensor-gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/api
          load: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build sensor-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/web
          load: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
            ${{ env.WEB_IMAGE }}:latest

      - name: Scan sensor-gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

      - name: Scan sensor-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.70.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          docker push "${API_IMAGE}:${SHA}"
          docker push "${API_IMAGE}:latest"
          docker push "${WEB_IMAGE}:${SHA}"
          docker push "${WEB_IMAGE}:latest"

      - name: SBOM (SPDX) for images
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          image: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.sha }}
          format: spdx-json
          output-file: sbom-sensor-gateway.spdx.json
          upload-artifact: true

      - name: SBOM (SPDX) for web image
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          image: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.sha }}
          format: spdx-json
          output-file: sbom-sensor-web.spdx.json
          upload-artifact: true

  iac:
    # Terraform 1.9.8, ansible-core 2.17.14, cloud-init 26.1, Trivy config HIGH/CRITICAL.
    # Провайдер libvirt 0.8.3 отдаёт схему без демона libvirt (проверено init/validate).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # wrapper перехватывает код возврата: fmt -check и validate тогда не роняют шаг.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt, init, validate
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Ansible syntax-check
        run: |
          python -m pip install ansible-core==2.17.14
          ansible-playbook --syntax-check -i infra/ansible/inventory.ini infra/ansible/site.yml

      - name: cloud-init schema
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y cloud-init
          # Версия из archive ubuntu-24.04 (точный пин apt ломается при обновлении архива); печатается в лог.
          cloud-init --version
          # user-data.yaml.tftpl — шаблон templatefile (%{ if }, ${...}), не cloud-config.
          # Схема проверяет пример рендера и network-config.
          cloud-init schema -c infra/cloud-init/user-data.example.yaml
          cloud-init schema --schema-type network-config -c infra/cloud-init/network-config.yaml

      # По умолчанию Trivy рендерит чарт как Kubernetes 1.20, а kubeVersion чарта — >=1.28:
      # без версии рендер падает и сканер не видит манифесты.
      - name: Trivy config (Helm)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_HELM_KUBE_VERSION: "1.31.0"
          TRIVY_HELM_API_VERSIONS: "monitoring.coreos.com/v1,monitoring.coreos.com/v1/ServiceMonitor"
        with:
          scan-type: config
          scan-ref: deploy/helm/sensor-gateway
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.70.0

      - name: Trivy config (API Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: services/api/Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.70.0

      - name: Trivy config (web Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: apps/web/Dockerfile
          trivyignores: apps/web/.trivyignore
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.70.0

      - name: Trivy config (Terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          version: v0.70.0

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Helm
        if: ${{ hashFiles('deploy/helm/sensor-gateway/**', 'deploy/helm/sensor-gateway/*') != '' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Lint and template chart
        if: ${{ hashFiles('deploy/helm/sensor-gateway/**', 'deploy/helm/sensor-gateway/*') != '' }}
        run: |
          helm lint deploy/helm/sensor-gateway
          helm template sensor deploy/helm/sensor-gateway --namespace sensor

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # v3.16.3 — то же значение, что HELM_VERSION в scripts/lint-manifests.sh.
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.3

      - name: Validate chart and monitoring manifests
        run: ./scripts/lint-manifests.sh

  dockerfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: services/api/Dockerfile
          failure-threshold: error

      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: apps/web/Dockerfile
          failure-threshold: error

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # shellcheck 0.10.0: бинарь из PATH или образ koalaman/shellcheck:v0.10.0 (Makefile, lint-shellcheck).
      - name: Shellcheck
        run: make lint-shellcheck

  llm:
    # Валидатор LLM-вывода и цикл исправления без модели (фейковый OpenAI-сервер) + promtool на эталонном правиле.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.2 pytest==8.3.4 ruff==0.8.4
      - run: ruff check llm
      - run: python -m pytest -q llm
      - name: Validator + promtool (Docker) on deploy/monitoring/prometheusrule.yaml
        run: python llm/llm_gen.py validate-rule deploy/monitoring/prometheusrule.yaml
