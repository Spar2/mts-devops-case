# Netplan (cloud-init network-config v2) для ВМ: DHCP на первом virtio-интерфейсе,
# статический вариант — закомментирован. На OpenStack сеть обычно приходит из metadata,
# тогда этот файл не передают.
network:
  version: 2
  ethernets:
    primary:
      match:
        name: "en*"
      dhcp4: true
      # dhcp4: false
      # addresses: [192.168.122.50/24]
