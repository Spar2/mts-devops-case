---
# Плейбук-обёртка над единой точкой входа `make k8s-up`, чтобы логика установки
# (k3s, ingress-nginx, SOPS-секрет, kube-prometheus-stack, Helm-релиз) не дублировалась.
# Запуск: ansible-playbook -i infra/ansible/inventory.ini infra/ansible/site.yml
# Переменные окружения (K3D, CLUSTER, K3D_PRELOAD, INGRESS_SERVICE_TYPE, INGRESS_PORT, TAG...)
# передаются в make как есть. CLUSTER по умолчанию mts (имя k3d-кластера).
- name: Sensor gateway cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ (playbook_dir + '/../..') | realpath }}"
  tasks:
    - name: Check prerequisites
      ansible.builtin.command:
        argv: [bash, -c, "command -v make && command -v docker && command -v curl"]
      changed_when: false

    - name: Run make k8s-up
      ansible.builtin.command:
        argv: [make, -C, "{{ repo_root }}", k8s-up]
      register: k8s_up
      changed_when: true

    - name: Show tail of make output
      ansible.builtin.debug:
        msg: "{{ k8s_up.stdout_lines[-12:] }}"
