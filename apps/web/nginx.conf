server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # ingress-nginx sets X-Real-IP to the TCP client. The client can forge
  # X-Forwarded-For, so that chain is not forwarded. An empty value drops it.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For "";
  }
  location = /health {
    proxy_pass http://api:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For "";
  }
  location = /ready {
    proxy_pass http://api:8000/ready;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For "";
  }
  # /metrics is not proxied. Prometheus scrapes the API Service.
  location = /metrics {
    return 403;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
