# Stable release (name "sensor"): track=stable and canary.enabled=false.
# Canary is a second install of this chart, release name "sensor-canary",
# with track=canary and canary.enabled=true.
track: stable

image:
  # latest is pulled every time. A git short sha stays IfNotPresent.
  pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/spar2/mts-devops-case/sensor-gateway
    tag: latest
  web:
    repository: ghcr.io/spar2/mts-devops-case/sensor-web
    tag: latest

# Optional list of {name: pull-secret} when GHCR is private.
imagePullSecrets: []

# Existing Secret key DEMO_PASSWORD. The chart does not create the Secret.
existingSecret: sensor-secrets

env:
  demoUsername: demo
  # The string "true" or "false". The API compares SECURE_COOKIES to "true".
  # localtest.me is plain HTTP, so cookies must not be marked Secure.
  secureCookies: "false"

ingress:
  host: sensor.localtest.me
  className: nginx

canary:
  enabled: false
  # Integer 0-100. Used only when track=canary and canary.enabled=true.
  weight: 10

serviceMonitor:
  # Rendered only when this is true and the ServiceMonitor CRD is installed.
  # Label release=mon matches kube-prometheus-stack release "mon".
  enabled: true
  interval: 30s

api:
  # Ignored when track=canary (the template pins 1 replica).
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

web:
  # Ignored when track=canary (the template pins 1 replica).
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Ingress: API :8000 from this release's web pods and from namespace monitoring;
# web :80 from namespace ingress-nginx.
# Egress: web to kube-system DNS :53 and to this release's API :8000.
# API has no egress rules: services/api does not dial out.
# track=canary keeps these policies (one replica, but the same paths).
networkPolicy:
  enabled: true

# Stable only. minAvailable 1 with 2 replicas allows one eviction.
# track=canary does not render PDB (a single replica plus minAvailable 1
# blocks drains, and uninstall would wait on it).
pdb:
  enabled: true
  minAvailable: 1

# Stable only. CPU HPA, autoscaling/v2. Requests are on the containers.
# helm --wait does not wait for the HPA: a missing metrics-server leaves
# the Deployment at api.replicas / web.replicas. k3s ships metrics-server.
# track=canary does not render HPA.
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
