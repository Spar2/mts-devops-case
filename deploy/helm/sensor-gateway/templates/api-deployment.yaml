apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sensor-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ include "sensor-gateway.componentReplicas" (dict "root" . "component" "api") }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "sensor-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  # Старый под не снимаем, пока новый не Ready: иначе на время замены
  # запросу некуда идти. У canary реплика одна, у stable их две.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "sensor-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      # 5 с preStop входят в этот срок. Дальше SIGTERM: uvicorn сам закрывает приём
      # и дожидается текущих запросов (timeout_graceful_shutdown не задан).
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ include "sensor-gateway.pullPolicy" (list .Values.image.api.tag .Values.image.pullPolicy) }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # Пауза до SIGTERM: Endpoints и kube-proxy успевают убрать под,
          # пока процесс ещё принимает запросы. /bin/sleep есть в образе и
          # не пишет на диск (readOnlyRootFilesystem).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DEMO_USERNAME
              value: {{ .Values.env.demoUsername | quote }}
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DEMO_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: SESSION_SECRET
                  optional: false
            - name: SECURE_COOKIES
              value: {{ .Values.env.secureCookies | quote }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.env.trustedProxyCidrs | quote }}
            # Тег образа. /ready отдаёт его в JSON version и в заголовке X-App-Version,
            # чтобы smoke отличил canary от stable.
            - name: APP_VERSION
              value: {{ .Values.image.api.tag | quote }}
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
