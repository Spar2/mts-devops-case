apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sensor-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "sensor-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  # Как у API: новый под Ready раньше, чем снимается старый.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "sensor-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/nginx-config: {{ include "sensor-gateway.nginxConf" . | sha256sum | quote }}
    spec:
      # Та же гонка, что у API, но уже со стороны ingress-nginx: SIGTERM уходит
      # после паузы. 40 с покрывают sleep и остановку nginx.
      terminationGracePeriodSeconds: 40
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # nginx:1.29-alpine master stays root: it binds port 80 and setuid's workers.
      # Do not set runAsNonRoot. /var/run is a symlink to /run (pid /run/nginx.pid);
      # the emptyDir is mounted on that target.
      # Pod securityContext is explicit (seccomp only) so the pod does not run
      # with an empty default context. runAsNonRoot here would block the master.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ include "sensor-gateway.pullPolicy" (list .Values.image.web.tag .Values.image.pullPolicy) }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - NET_BIND_SERVICE
                - DAC_OVERRIDE
            seccompProfile:
              type: RuntimeDefault
          # /bin/sleep есть в nginx:1.29-alpine и не пишет на диск.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          # Пробы web проверяют сам nginx (статический /), а не API за ним:
          # иначе падение API перезапускало бы и web.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-web-nginx
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
