{{- if not .Values.existingSecret -}}
{{- fail "existingSecret is required (Secret key DEMO_PASSWORD)" -}}
{{- end -}}
{{- if not .Values.image.api.repository -}}
{{- fail "image.api.repository is required" -}}
{{- end -}}
{{- if not .Values.image.web.repository -}}
{{- fail "image.web.repository is required" -}}
{{- end -}}
{{- if not .Values.ingress.host -}}
{{- fail "ingress.host is required" -}}
{{- end -}}
{{- if not (or (eq .Values.track "stable") (eq .Values.track "canary")) -}}
{{- fail "track must be stable or canary" -}}
{{- end -}}
{{- if and (eq .Values.track "canary") (not .Values.canary.enabled) -}}
{{- fail "track=canary requires canary.enabled=true" -}}
{{- end -}}
{{- if and (eq .Values.track "stable") .Values.canary.enabled -}}
{{- fail "canary.enabled is only valid when track=canary" -}}
{{- end -}}
{{- $weight := .Values.canary.weight | int -}}
{{- if or (lt $weight 0) (gt $weight 100) -}}
{{- fail "canary.weight must be between 0 and 100" -}}
{{- end -}}
{{- if ne .Values.track "canary" -}}
{{- if .Values.pdb.enabled -}}
{{- $pdbMin := .Values.pdb.minAvailable | int -}}
{{- if lt $pdbMin 1 -}}
{{- fail "pdb.minAvailable must be >= 1" -}}
{{- end -}}
{{- if or (le (.Values.api.replicas | int) $pdbMin) (le (.Values.web.replicas | int) $pdbMin) -}}
{{- fail "pdb.minAvailable must be lower than api.replicas and web.replicas" -}}
{{- end -}}
{{- end -}}
{{- if .Values.hpa.enabled -}}
{{- $hpaMin := .Values.hpa.minReplicas | int -}}
{{- $hpaMax := .Values.hpa.maxReplicas | int -}}
{{- $hpaCPU := .Values.hpa.targetCPUUtilizationPercentage | int -}}
{{- if or (lt $hpaMin 1) (lt $hpaMax $hpaMin) -}}
{{- fail "hpa.minReplicas must be >= 1 and hpa.maxReplicas must be >= minReplicas" -}}
{{- end -}}
{{- if or (lt $hpaCPU 1) (gt $hpaCPU 100) -}}
{{- fail "hpa.targetCPUUtilizationPercentage must be between 1 and 100" -}}
{{- end -}}
{{- if or (lt (.Values.api.replicas | int) $hpaMin) (lt (.Values.web.replicas | int) $hpaMin) -}}
{{- fail "api.replicas and web.replicas must be >= hpa.minReplicas" -}}
{{- end -}}
{{- end -}}
{{- end -}}
