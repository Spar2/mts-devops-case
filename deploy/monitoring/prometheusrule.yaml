apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sensor-gateway
  namespace: monitoring
  labels:
    release: mon
spec:
  groups:
    - name: sensor-gateway
      rules:
        - alert: SensorGatewayDown
          expr: (sum(up{namespace="sensor", service=~".*-api"}) or vector(0)) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "sensor-gateway: API не отвечает"
            description: "В namespace sensor уже минуту нет ни одного живого target Service *-api (stable sensor-api и канарейка sensor-canary-api). sum(up) равен 0, в том числе когда поды сняты и ряд up исчез."
        - alert: SensorGatewayNoReplicas
          expr: (kube_deployment_spec_replicas{namespace="sensor"} > 0) and on(namespace, deployment) (kube_deployment_status_replicas_available{namespace="sensor"} == 0)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "sensor-gateway: у Deployment {{ $labels.deployment }} нет доступных реплик"
            description: "Deployment {{ $labels.deployment }} в namespace sensor должен иметь реплики, но доступных 0 уже минуту (kube-state-metrics)."
        - alert: SensorGatewayPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="sensor"}[15m]) > 3
          labels:
            severity: warning
          annotations:
            summary: "sensor-gateway: контейнер {{ $labels.container }} перезапускается"
            description: "Под {{ $labels.pod }} перезапустился больше 3 раз за 15 минут (crash loop или падающая liveness-проба)."
        - alert: SensorGatewayIngress5xx
          expr: (sum(rate(nginx_ingress_controller_requests{exported_namespace="sensor",status=~"5.."}[5m])) or vector(0)) / sum(rate(nginx_ingress_controller_requests{exported_namespace="sensor"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "sensor-gateway: больше 5% ответов 5xx через ingress"
            description: "Доля 5xx среди запросов к ingress namespace sensor (stable и canary) больше 5% уже 5 минут (метрики ingress-nginx)."
        - alert: SensorGatewayHighLatency
          expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket{namespace="sensor"}[5m]))) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "sensor-gateway: высокая задержка HTTP ({{ $labels.service }})"
            description: "p95 гистограммы http_request_duration_seconds у Service {{ $labels.service }} больше 0.5 с уже 2 минуты. Пока запросов нет, rate пустой и алерт не зажигается."
