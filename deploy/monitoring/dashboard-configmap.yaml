apiVersion: v1
kind: ConfigMap
metadata:
  name: sensor-gateway-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Sensor
data:
  sensor-gateway.json: |
    {
      "uid": "sensor-gateway",
      "title": "sensor-gateway",
      "description": "sensor-gateway: process gauge, request rate, last probe latency, scrape target.",
      "tags": ["sensor-gateway", "sensor"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "service_up",
          "description": "Gauge from GET /metrics. 1 while the API process serves metrics.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 7, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {"text": "нет данных", "color": "red"}
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "service_up",
              "legendFormat": "{{pod}}",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "up{job=~\".*sensor.*api.*\"}",
          "description": "Prometheus scrape of the api Service (stable sensor-api and canary sensor-canary-api).",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 7, "w": 18, "x": 6, "y": 0},
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "up{job=~\".*sensor.*api.*\"}",
              "legendFormat": "{{namespace}}/{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "rate(http_requests_total[1m])",
          "description": "Requests per second. The counter includes the /metrics scrape itself.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 7},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(http_requests_total[1m])",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "service_probe_latency_seconds",
          "description": "Latency of the latest POST /api/v1/service/probe. Alert threshold is 0.5s.",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 7},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false,
                "thresholdsStyle": {"mode": "line"}
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.5}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true},
            "tooltip": {"mode": "multi", "sort": "none"}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "service_probe_latency_seconds",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
